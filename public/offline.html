<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>Sem conexão · Prodexy Labs</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; padding: 24px; display: grid; place-items: center; background: #f5f6f8; color: #101318; font-family: Arial, sans-serif; }
      main { width: min(100%, 420px); padding: 28px; border: 1px solid #dfe3e8; border-radius: 8px; background: #fff; text-align: center; box-shadow: 0 10px 28px rgba(16,19,24,.08); }
      img { width: 52px; height: 52px; border-radius: 8px; }
      h1 { margin: 18px 0 8px; font-size: 21px; letter-spacing: 0; }
      p { margin: 0; color: #687180; font-size: 14px; line-height: 1.55; }
      button { min-height: 40px; margin-top: 20px; border: 1px solid #cfd5dc; border-radius: 7px; padding: 0 16px; background: #fff; color: #101318; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/pwa/icon-192.png" alt="">
      <h1>Sem conexão</h1>
      <p>Conecte-se à internet para acessar os dados atualizados da Prodexy Labs.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
